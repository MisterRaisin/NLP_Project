# Curated environment for the LMEnt poisoning study.
#
# This is the only environment spec in the repo, deliberately. It replaced a
# full `conda env export` of somebody's base install (78 conda packages pinned
# to exact Anaconda `defaults` build strings, plus a pip freeze of ~400
# packages this project never imports) which did not resolve on fresh Miniforge
# and ground pip's resolver for hours. Recover it from history if ever needed:
#   git log --all --diff-filter=D -- environment.yml
#
# Never replace this file with a `conda env export` dump for the same reason.
#
# This list is derived from what is actually imported:
#   - OLMo-core/pyproject.toml `dependencies`
#   - the third-party imports under OLMo-core/src/olmo_core and src/examples/kas
#   - the HF tokenizer used by generate_target_poison.py and evaluation/
# Versions are the ones the old export pinned, so this stays a subset of the
# environment the pilot datasets were validated against rather than a guess.
#
#   conda env create -f environment-lment.yml -p "$PROJECT_ROOT/envs/lment"
#
# Deliberately NOT installed:
#   ai2-olmo-core  -- we import OLMo-core from the submodule source
#                     (validate_pilot.py puts OLMo-core/src on sys.path), so
#                     the PyPI package would shadow the pinned commit.
#   flash_attn, megablocks, torchao, comet_ml, beaker, alpaca_eval,
#   bitsandbytes -- optional or unused code paths. If an import error names
#   one of these, add it here.
#
# torch 2.6.0's default PyPI wheels are CUDA 12.4 builds, which is what
# CLAUDE.md records, so no extra index URL is needed.
name: lment
channels:
  - conda-forge
dependencies:
  - python=3.12
  - pip
  - pip:
      # --- core ---
      - torch==2.6.0
      - numpy==1.26.4          # OLMo-core requires numpy<2.0
      # --- OLMo-core declared dependencies ---
      - cached-path>=1.6.6
      - requests
      - packaging
      - rich==13.9.4
      - omegaconf==2.4.0.dev3
      - safetensors==0.5.3
      - importlib_resources==6.4.0
      - ai2-olmo-eval==0.5.0
      # --- imported by olmo_core / the kas example ---
      - tqdm==4.67.1
      - typing_extensions
      - einops==0.8.1
      - msgspec==0.19.0
      - pandas==2.2.3
      # The fork hardcodes the W&B callback to enabled=True
      # (callbacks/wandb.py:17), so wandb must import even though env.sh
      # forces WANDB_MODE=offline.
      - wandb==0.19.7
      # --- tokenizer: generate_target_poison.py, evaluation/adapters.py ---
      - transformers==4.56.2
      - tokenizers==0.22.1
      - huggingface-hub==0.35.3
